# House MultiQC config for the 10x pipeline.
# Override with --multiqcconfig to use your own instead.

data_format: 'yaml'
show_analysis_time: False
show_analysis_paths: False
theme_style: light
plots_force_interactive: True

# MultiQC's own version detection is off. The pipeline supplies its own
# Software Versions section from the versions.yml every process emits, so the
# table reports what the tools actually said rather than what MultiQC infers
# from filenames.
disable_version_detection: True

# Cell Ranger first, our versions table pinned to the very end.
# cellranger_arc is left enabled so it starts working the day MultiQC fixes
# https://github.com/MultiQC/MultiQC/issues/3609 - it cannot parse
# cellranger-arc 2.2 web summaries today, which is why the pipeline supplies
# cellranger_arc_metrics itself. There is no cellranger-atac module at all, so
# cellranger_atac_metrics is rendered by the pipeline for the same reason.
report_section_order:
  cellranger:
    order: 100
  cellranger_arc:
    order: 90
  cellranger_arc_metrics_library:
    order: 82
  cellranger_arc_metrics_atac:
    order: 81
  cellranger_arc_metrics_gex:
    order: 80
  cellranger_atac_metrics_table:
    order: 70
  cellranger_atac_metrics_ws_sequencing:
    order: 69
  cellranger_atac_metrics_ws_cells:
    order: 68
  cellranger_atac_metrics_ws_mapping:
    order: 67
  cellranger_atac_metrics_ws_targeting:
    order: 66
  cellranger_atac_metrics_ws_complexity:
    order: 65
  pipeline_software_versions:
    order: -1000
