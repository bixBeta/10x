name: build-container

# =============================================================================
#  Builds a 10x tool image and pushes it to a PRIVATE GHCR package.
#
#  This repository is public, so the Cell Ranger tarball can never live in it
#  (no release assets, no committed files) - the 10x EULA forbids
#  redistribution. Instead the tarball is fetched at build time from a signed
#  10x download URL held in a repository secret.
#
#  Before building a version:
#    1. Go to https://www.10xgenomics.com/support/software/cell-ranger/downloads
#       and accept the EULA to reveal the signed download link (it expires,
#       so refresh it each time you build).
#    2. Store it as the repository secret TENX_DOWNLOAD_URL:
#         gh secret set TENX_DOWNLOAD_URL --body '<signed-url>'
#    3. Run this workflow with the matching tool + version.
#
#  The secret is masked in logs and is not exposed to pull requests from forks.
#
#  IMPORTANT: the resulting GHCR package must stay PRIVATE, even though the
#  repository is public. New packages are private by default - verify at
#  https://github.com/users/bixBeta/packages after the first push.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      tool:
        description: 'Which 10x tool to build'
        required: true
        default: 'cellranger'
        type: choice
        options:
          - cellranger
          - cellranger-atac
          - cellranger-arc
      version:
        description: 'Version, e.g. 9.0.1 (must match the tarball behind TENX_DOWNLOAD_URL)'
        required: true
        default: '9.0.1'
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Download tarball from 10x
        env:
          TENX_DOWNLOAD_URL: ${{ secrets.TENX_DOWNLOAD_URL }}
        run: |
          set -euo pipefail
          if [ -z "${TENX_DOWNLOAD_URL:-}" ] ; then
            echo "::error::Repository secret TENX_DOWNLOAD_URL is not set. Add it under Settings > Secrets and variables > Actions, using only the quoted URL from the 10x download page (not the whole curl command)."
            exit 1
          fi

          # The 10x downloads page shows a full `curl -o ... "https://..."` line.
          # Pasting all of it is the easy mistake, so say so plainly.
          case "$TENX_DOWNLOAD_URL" in
            http*) : ;;
            *) echo "::error::TENX_DOWNLOAD_URL does not start with http. Store only the URL itself, without the surrounding curl command or quotes."
               exit 1 ;;
          esac

          TARBALL="${{ inputs.tool }}-${{ inputs.version }}.tar.gz"
          # -sS keeps the signed URL out of the log
          curl -fsSL "$TENX_DOWNLOAD_URL" -o "containers/cellranger/$TARBALL"
          ls -lh "containers/cellranger/$TARBALL"

          # Fail early if the URL pointed at a different version than requested
          if ! tar -tzf "containers/cellranger/$TARBALL" | head -n1 | grep -q "^${{ inputs.tool }}-${{ inputs.version }}/" ; then
            echo "::error::Tarball does not contain ${{ inputs.tool }}-${{ inputs.version }}/ - the URL and the version input disagree."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: containers/cellranger
          file: containers/cellranger/Dockerfile
          push: true
          provenance: false
          build-args: |
            TOOL=${{ inputs.tool }}
            VERSION=${{ inputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ inputs.tool }}:${{ inputs.version }}

      - name: Summary
        run: |
          {
            echo "### Built \`${{ inputs.tool }}:${{ inputs.version }}\`"
            echo ''
            echo '```'
            echo "${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ inputs.tool }}:${{ inputs.version }}"
            echo '```'
            echo ''
            echo 'Use it with:'
            echo '```bash'
            echo "nextflow run bixBeta/10x --cellranger_version ${{ inputs.version }}"
            echo '```'
            echo ''
            echo '> Check the package visibility is **private** - the repo is public, but the 10x EULA forbids redistributing Cell Ranger.'
          } >> "$GITHUB_STEP_SUMMARY"
