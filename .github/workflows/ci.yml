name: ci

# Syntax + channel logic check. Runs with -stub-run, so no Cell Ranger,
# no containers and no real data are needed.

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  stub:
    name: stub-run (NF ${{ matrix.nxf_ver }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 25.04.1 is what the server runs. Nextflow 26 ships a strict script
        # syntax that rejects top level statements, so the flat layout used
        # across the bixBeta pipelines (params + if(params.help) + banner at
        # file scope) will not compile there. Pinned deliberately until that
        # style question is settled for all the pipelines at once.
        nxf_ver: [ '25.04.1' ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nxf_ver }}

      - name: Generate test data
        run: bash test/make_test_data.sh

      - name: Retry policy applies to every process
        run: |
          set -euo pipefail
          # resolved config, not the source, so a withName block that silently
          # overrode the global setting would show up here
          nextflow config . | grep -q 'maxRetries' || { echo "maxRetries missing"; exit 1; }
          nextflow config . | grep -q 'errorStrategy' || { echo "errorStrategy missing"; exit 1; }
          nextflow config . | grep -q 'maxForks' || { echo "maxForks missing"; exit 1; }
          nextflow config . | sed -n '/^process {/,/^}/p' | grep -E 'maxForks|maxRetries|errorStrategy'

      - name: Help text
        run: nextflow run . --help

      - name: List references
        run: nextflow run . --listRefs

      - name: Singularity engine resolves the sif path
        run: |
          set -euo pipefail
          # default engine is singularity: the container directives must point at
          # <sifdir>/<tool>-<version>.sif, and nothing may reference a registry
          cfg=$(nextflow config .)
          echo "$cfg" | grep -q "/local/workdir/10x_analysis/singularity-sifs/cellranger-9.0.1.sif" || {
            echo "$cfg" | grep -i container; echo "sif path not resolved"; exit 1; }
          echo "$cfg" | grep -q "/local/workdir/10x_analysis/singularity-sifs/cellranger-arc-2.2.0.sif" || {
            echo "arc sif not resolved"; exit 1; }
          if echo "$cfg" | grep -q 'ghcr.io' ; then
            echo "config still references a registry"; exit 1
          fi
          echo "sif resolution OK"

      - name: Engine is reported and forced correctly
        run: |
          set -euo pipefail
          # the banner reports the resolved engine and image/binary
          out=$(nextflow run . -stub-run -c test/ci.config --sheet test/sample-sheet.csv --ref test/ref \
                  --sifdir /shared/sif 2>&1)
          echo "$out" | grep -qE 'engine +: singularity'            || { echo "$out" | tail -20; exit 1; }
          echo "$out" | grep -q  '/shared/sif/cellranger-9.0.1.sif' || { echo "$out" | tail -20; exit 1; }

          # a binary path forces local for that tool
          out=$(nextflow run . -stub-run -c test/ci.config --sheet test/sample-sheet.csv --ref test/ref \
                  --crpath /programs/cellranger-9.0.1/cellranger 2>&1)
          echo "$out" | grep -qE 'engine +: local'                              || { echo "$out" | tail -20; exit 1; }
          echo "$out" | grep -q  '/programs/cellranger-9.0.1/cellranger'        || { echo "$out" | tail -20; exit 1; }
          echo "engine selection OK"

      - name: Reference must be a reference, not a parent dir
        run: |
          set -euo pipefail
          # a species dir holding builds is named as such, with the builds listed
          mkdir -p test/refparent/CanFam3_1 test/refparent/CanFam4
          echo '{}' > test/refparent/CanFam3_1/reference.json
          echo '{}' > test/refparent/CanFam4/reference.json
          out=$(nextflow run . -c test/ci.config --sheet test/sample-sheet.csv \
                  --ref "$PWD/test/refparent" --crpath "$PWD/test/fake-cellranger" \
                  --localcores 2 --localmem 4 2>&1) && { echo "expected failure"; exit 1; }
          echo "$out" | grep -q 'is not a reference itself, it holds 2' || { echo "$out" | tail -20; exit 1; }
          echo "$out" | grep -q 'CanFam3_1, CanFam4' || { echo "$out" | tail -20; exit 1; }

          # a missing reference is named too
          out=$(nextflow run . -c test/ci.config --sheet test/sample-sheet.csv \
                  --ref /no/such/ref --crpath "$PWD/test/fake-cellranger" \
                  --localcores 2 --localmem 4 2>&1) && { echo "expected failure"; exit 1; }
          echo "$out" | grep -q 'No cellranger reference at' || { echo "$out" | tail -20; exit 1; }
          echo "reference checks OK"

      - name: Missing sif fails with a clear message
        run: |
          set -euo pipefail
          out=$(nextflow run . -c test/ci.config --sheet test/sample-sheet.csv --ref test/ref \
                  --sifdir "$PWD/nosuchdir" 2>&1) && { echo "expected failure"; exit 1; }
          echo "$out" | grep -q 'No cellranger image at' || { echo "$out" | tail -20; echo "wrong error"; exit 1; }
          echo "missing sif rejected"

      - name: build-sif.sh argument handling
        run: |
          set -euo pipefail
          bash -n containers/build-sif.sh
          # unknown tool is rejected before anything else happens
          if bash containers/build-sif.sh nonsense 1.0 /tmp/x.tar.gz 2>/dev/null ; then
            echo "expected rejection of an unknown tool"; exit 1
          fi
          echo "build-sif.sh OK"

      - name: List programs
        run: nextflow run . --listPrograms

      - name: Missing local install fails with a clear message
        run: |
          set -euo pipefail
          # no --crpath, and /programs/cellranger-9.0.1 does not exist here
          out=$(nextflow run . -c test/ci.config --engine local --sheet test/sample-sheet.csv --ref test/ref 2>&1) && {
            echo "expected failure for a missing cellranger install"; exit 1; }
          echo "$out" | grep -q 'No cellranger found at' || { echo "$out" | tail -20; echo "wrong error"; exit 1; }
          echo "missing install rejected"

      - name: Version resolves to the conventional path
        env:
          CI_CAPTURE: ${{ github.workspace }}/ci-capture-ver
        run: |
          set -euo pipefail
          rm -rf CELLRANGER "$CI_CAPTURE"
          # --programs + --crversion build the path, no --crpath needed
          mkdir -p fakeprograms/cellranger-8.0.1
          cp test/fake-cellranger fakeprograms/cellranger-8.0.1/cellranger
          export FAKE_VERSION=8.0.1
          nextflow run . -c test/ci.config --engine local --sheet test/sample-sheet.csv --ref test/ref \
            --programs "$PWD/fakeprograms" --crversion 8.0.1 \
            --localcores 2 --localmem 4
          grep -qx -- '--id=JS4' "$CI_CAPTURE/JS4.command.txt"
          # cellranger 8 still takes --create-bam, not --no-bam
          grep -qx -- '--create-bam=false' "$CI_CAPTURE/JS4.command.txt"
          echo "version path resolution OK"

      - name: GEX stub run
        run: |
          nextflow run . -stub-run -c test/ci.config \
            --sheet test/sample-sheet.csv \
            --ref   test/ref \
            --id    CI_TEST

      - name: DEBUG publish
        run: |
          echo "--- launch dir ---"; ls -la | head -20
          echo "--- task dirs ---"; find work -maxdepth 3 -name '.command.sh' | head -3
          echo "--- files named *_web_summary.html anywhere ---"; find . -name '*_web_summary.html' 2>/dev/null | head -10
          echo "--- one task dir listing ---"; d=$(find work -maxdepth 3 -name '.command.sh' | head -1); ls -la "$(dirname "$d")"
          echo "--- that task's script ---"; sed -n '1,40p' "$d"

      - name: Check the grouping
        run: |
          set -euo pipefail
          # 5 sheet rows -> 4 libraries: JS5's two runs pool into one count,
          # JS6's two GEM wells stay separate.
          for lib in JS4 JS5 JS6_wellA JS6_wellB ; do
            test -d "CELLRANGER/$lib" || { echo "missing CELLRANGER/$lib"; exit 1; }
          done
          n=$(ls -1 CELLRANGER | wc -l)
          test "$n" -eq 4 || { echo "expected 4 libraries, got $n"; ls CELLRANGER; exit 1; }
          echo "grouping OK: $(ls CELLRANGER | tr '\n' ' ')"

          # flat collections, one link per library, prefixed with the label
          for lib in JS4 JS5 JS6_wellA JS6_wellB ; do
            test -L "web_summary_htmls/${lib}_web_summary.html"   || { ls -l web_summary_htmls; echo "missing summary link for $lib"; exit 1; }
            test -L "summary_metrics/${lib}_metrics_summary.csv"  || { ls -l summary_metrics;   echo "missing metrics link for $lib"; exit 1; }
          done
          # and they must be symlinks into the work dir, not copies
          readlink "web_summary_htmls/JS4_web_summary.html" | grep -q '/work/' || {
            echo "expected a symlink into work/"; exit 1; }
          echo "collections OK: $(ls web_summary_htmls | tr '\n' ' ')"

      - name: Rejects a bad mode
        run: |
          if nextflow run . -stub-run -c test/ci.config --sheet test/sample-sheet.csv --ref test/ref --mode nope ; then
            echo "expected failure for --mode nope" ; exit 1
          fi
          echo "bad mode rejected"

      - name: Real command line (fake cellranger via --crpath)
        env:
          CI_CAPTURE: ${{ github.workspace }}/ci-capture
        run: |
          set -euo pipefail
          rm -rf CELLRANGER "$CI_CAPTURE"
          nextflow run . -c test/ci.config \
            --sheet test/sample-sheet.csv \
            --ref   "$PWD/test/ref" \
            --crpath "$PWD/test/fake-cellranger" \
            --localcores 2 --localmem 4

          echo "--- command built for JS5 (two sequencing runs) ---"
          cat "$CI_CAPTURE/JS5.command.txt"

          for flag in 'count' '--id=JS5' '--localcores=2' '--localmem=4' \
                      '--create-bam=false' '--r1-length=28' \
                      "--transcriptome=$PWD/test/ref" ; do
            grep -qx -- "$flag" "$CI_CAPTURE/JS5.command.txt" || { echo "missing flag: $flag"; exit 1; }
          done

          # two sequencing runs -> both dirs and BOTH sample prefixes, comma joined.
          # The flow cell is part of the prefix, so they genuinely differ.
          grep -q -- '--fastqs=.*run1.*,.*run2' "$CI_CAPTURE/JS5.command.txt"
          grep -q -- '--sample=SC2620_JS5_G3_Sofia_10488923_253GGLLT4,SC2620_JS5_G3_Sofia_10488923_999XYZAB2' "$CI_CAPTURE/JS5.command.txt"

          # single run library gets a single dir and prefix
          grep -qx -- '--sample=SC2620_JS4_G3_Reign_10488923_253GGLLT4' "$CI_CAPTURE/JS4.command.txt"
          echo "command line OK"

          # nothing may be staged or renamed: the dirs go through verbatim
          grep -q -- '--fastqs=/' "$CI_CAPTURE/JS4.command.txt" || { echo "expected absolute delivery paths"; exit 1; }
          if grep -q -- '--fastqs=fqs' "$CI_CAPTURE/JS4.command.txt" ; then
            echo "fastqs were staged, expected pass-through"; exit 1
          fi
          echo "pass-through OK"

          test -s pipeline_info/software_versions.yml
          grep -q 'cellranger' pipeline_info/software_versions.yml
          echo "versions OK"

      - name: r1length 0 omits the flag
        env:
          CI_CAPTURE: ${{ github.workspace }}/ci-capture2
        run: |
          set -euo pipefail
          rm -rf CELLRANGER "$CI_CAPTURE"
          nextflow run . -c test/ci.config --sheet test/sample-sheet.csv --ref test/ref \
            --crpath "$PWD/test/fake-cellranger" --localcores 2 --localmem 4 --r1length 0
          if grep -q -- '--r1-length' "$CI_CAPTURE/JS4.command.txt" ; then
            echo "expected no --r1-length"; exit 1
          fi
          echo "r1length 0 OK"

      - name: Accepts a fastq file path, not just a dir
        env:
          CI_CAPTURE: ${{ github.workspace }}/ci-capture3
        run: |
          set -euo pipefail
          rm -rf CELLRANGER "$CI_CAPTURE"
          # absolute: the pipeline resolves sheet paths against launchDir, so
          # --fastqs always comes out absolute
          FQ=$(ls "$PWD"/test/Illumina/run1/Unaligned/Project_10488923/Sample_SC2620_JS4_*/*_R1_001.fastq.gz | head -1)
          printf 'label,fastqs\nJS4,%s\n' "$FQ" > test/sheet-file.csv
          nextflow run . -c test/ci.config --sheet test/sheet-file.csv --ref test/ref \
            --crpath "$PWD/test/fake-cellranger" --localcores 2 --localmem 4
          # the file resolved to its parent dir, and the prefix came off the name
          grep -qx -- "--fastqs=$(dirname "$FQ")" "$CI_CAPTURE/JS4.command.txt"
          grep -qx -- '--sample=SC2620_JS4_G3_Reign_10488923_253GGLLT4' "$CI_CAPTURE/JS4.command.txt"
          echo "fastq file path OK"

      - name: Multiome (arc) builds libraries.csv
        env:
          CI_CAPTURE: ${{ github.workspace }}/ci-capture-arc
        run: |
          set -euo pipefail
          rm -rf CELLRANGER_ARC web_summary_htmls summary_metrics "$CI_CAPTURE"
          export FAKE_TOOL=cellranger-arc FAKE_VERSION=2.2.0
          nextflow run . -c test/ci.config --mode arc \
            --sheet test/sample-sheet-arc.csv \
            --ref   "$PWD/test/ref" \
            --arcpath "$PWD/test/fake-cellranger" \
            --localcores 2 --localmem 4

          echo "--- JS4_libraries.csv ---"
          cat "$CI_CAPTURE/JS4.libraries.csv"

          # header plus exactly the two libraries, typed the 10x way
          test "$(wc -l < "$CI_CAPTURE/JS4.libraries.csv")" -eq 3
          head -1 "$CI_CAPTURE/JS4.libraries.csv" | grep -qx 'fastqs,sample,library_type'
          grep -q ',SC2619_JS4_BC_MG3_8Healthy_10488522_25FWVCLT4,Gene Expression$'         "$CI_CAPTURE/JS4.libraries.csv"
          grep -q ',SC2619_JS4_MA_8Healthy_10488522_23C52HLT4,Chromatin Accessibility$'     "$CI_CAPTURE/JS4.libraries.csv"

          echo "--- command built for JS4 ---"
          cat "$CI_CAPTURE/JS4.command.txt"
          grep -qx -- 'count'                                                                   "$CI_CAPTURE/JS4.command.txt"
          grep -qx -- '--id=JS4'                                                                "$CI_CAPTURE/JS4.command.txt"
          grep -qx -- "--reference=$PWD/test/ref" "$CI_CAPTURE/JS4.command.txt"
          grep -qx -- '--libraries=JS4_libraries.csv'                                           "$CI_CAPTURE/JS4.command.txt"
          grep -qx -- '--create-bam=false'                                                      "$CI_CAPTURE/JS4.command.txt"
          # arc takes --reference, never --transcriptome / --fastqs / --sample
          if grep -qE -- '--(transcriptome|fastqs|sample)=' "$CI_CAPTURE/JS4.command.txt" ; then
            echo "arc command must not carry gex-only flags"; exit 1
          fi

          # and the csv is kept next to the results
          test -f CELLRANGER_ARC/JS4/JS4_libraries.csv

          # arc joins the same flat collections; its metrics file is summary.csv
          test -L web_summary_htmls/JS4_web_summary.html || { ls -l web_summary_htmls; exit 1; }
          test -L summary_metrics/JS4_summary.csv        || { ls -l summary_metrics;   exit 1; }
          echo "arc OK"

      - name: Ambiguous Project dir is rejected
        run: |
          set -euo pipefail
          if nextflow run . -c test/ci.config --sheet test/sample-sheet-ambiguous.csv --ref test/ref \
               --crpath "$PWD/test/fake-cellranger" --localcores 2 --localmem 4 ; then
            echo "expected failure: two prefixes under one path with no sample column"; exit 1
          fi
          echo "ambiguity rejected"

      - name: Rejects an ATAC library in gex mode
        run: |
          set -euo pipefail
          if nextflow run . -c test/ci.config --sheet test/sample-sheet-arc.csv --ref test/ref \
               --crpath "$PWD/test/fake-cellranger" --localcores 2 --localmem 4 ; then
            echo "expected failure: Chromatin Accessibility in gex mode"; exit 1
          fi
          echo "wrong library_type rejected"

      - name: Native install runs uncontainerised (singularity left enabled)
        env:
          CI_CAPTURE: ${{ github.workspace }}/ci-capture-native
        run: |
          set -euo pipefail
          rm -rf CELLRANGER CELLRANGER_ARC "$CI_CAPTURE"

          # No singularity on the runner, and test/native.config deliberately
          # does NOT disable it. If --crpath still tried to containerise, the
          # task would fail here instead of running on the host.
          command -v singularity && { echo "singularity present, test is not meaningful"; exit 1; } || true

          nextflow run . -c test/native.config \
            --sheet test/sample-sheet.csv --ref test/ref \
            --crpath "$PWD/test/fake-cellranger" \
            --localcores 2 --localmem 4
          grep -qx -- '--id=JS4' "$CI_CAPTURE/JS4.command.txt"
          echo "native gex OK"

          rm -rf CELLRANGER_ARC
          export FAKE_TOOL=cellranger-arc FAKE_VERSION=2.2.0
          nextflow run . -c test/native.config --mode arc \
            --sheet test/sample-sheet-arc.csv --ref "$PWD/test/ref" \
            --arcpath "$PWD/test/fake-cellranger" \
            --localcores 2 --localmem 4
          grep -qx -- '--libraries=JS4_libraries.csv' "$CI_CAPTURE/JS4.command.txt"
          echo "native arc OK"

      - name: Version guard catches a mislabelled image
        env:
          CI_CAPTURE: ${{ github.workspace }}/ci-capture-guard
        run: |
          set -euo pipefail
          rm -rf CELLRANGER "$CI_CAPTURE"

          # the binary reports 7.0.0 while the run asks for 9.0.1
          export FAKE_VERSION=7.0.0
          out=$(nextflow run . -c test/ci.config --sheet test/sample-sheet.csv --ref test/ref \
                  --crpath "$PWD/test/fake-cellranger" --localcores 2 --localmem 4 2>&1) && {
            echo "expected a version mismatch failure"; exit 1; }
          echo "$out" | grep -q 'asked for cellranger 9.0.1 but' || { echo "$out" | tail -25; echo "wrong error"; exit 1; }
          echo "version mismatch rejected"

          # same binary, asked for what it actually is -> runs
          rm -rf CELLRANGER "$CI_CAPTURE"
          nextflow run . -c test/ci.config --sheet test/sample-sheet.csv --ref test/ref \
            --crpath "$PWD/test/fake-cellranger" --crversion 7.0.0 --localcores 2 --localmem 4
          grep -qx -- '--id=JS4' "$CI_CAPTURE/JS4.command.txt"
          echo "matching version accepted"

          # and the check can be switched off
          rm -rf CELLRANGER "$CI_CAPTURE"
          nextflow run . -c test/ci.config --sheet test/sample-sheet.csv --ref test/ref \
            --crpath "$PWD/test/fake-cellranger" --checkversion false --localcores 2 --localmem 4
          grep -qx -- '--id=JS4' "$CI_CAPTURE/JS4.command.txt"
          echo "checkversion false honoured"
