name: ci

# Syntax + channel-logic checks. Runs the pipeline with -stub-run, so no
# Cell Ranger, no containers and no real data are needed.

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  stub:
    name: stub-run (NF ${{ matrix.nxf_ver }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nxf_ver: [ '24.04.4', 'latest-stable' ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nxf_ver }}

      - name: Generate test data
        run: bash assets/test_data/make_test_data.sh

      - name: Samplesheet validation only
        run: nextflow run . -profile test --validate_only

      - name: GEX stub run
        run: nextflow run . -profile test -stub-run

      - name: Multi-library / multi-run stub run
        run: nextflow run . -profile test_multi -stub-run --outdir results_multi

      - name: ARC samplesheet parses and is deferred
        run: nextflow run . -profile test_arc --validate_only

      - name: Show outputs
        if: always()
        run: find results results_multi -maxdepth 4 -type d 2>/dev/null | sort || true

  lint:
    name: config lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
      - name: Config resolves for every profile
        run: |
          for p in test test_multi test_arc docker singularity slurm ; do
            echo "== $p"
            nextflow config . -profile "$p" > /dev/null
          done
